name: build-test

on:
  pull_request:
    paths:
      - "LenovoTidyChecks/**"
      - ".github/workflows/build-test.yml"
  push:
    branches: [main, "release/**"]
    paths:
      - "LenovoTidyChecks/**"
      - ".github/workflows/build-test.yml"

# Cancel any in-flight runs for the same branch when a new push lands.
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Windows is back in the PR matrix: the LLVM 18 tarball install
        # is now cached via actions/cache (see "Cache LLVM 18 (Windows)"
        # below), so cold-cache cost is one ~3-5 minute install per
        # release of llvm-windows-x86_64-18.1.8-vN, and warm-cache cost
        # is ~30 seconds. The original 25+ minute install rationale
        # (commit e9504f8) no longer applies.
        os: [ubuntu-22.04, macos-14, windows-2022]
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v6

      - name: Disable Windows Defender real-time monitoring
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # LLVM 18 dev libraries (headers + cmake config files). The earlier
      # KyleMayes/install-llvm-action attempt only installed the runtime
      # tarball, so find_package(LLVM CONFIG) failed. We now use each
      # OS's canonical package source which ships the dev artefacts.
      - name: Install LLVM 18 + tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # apt.llvm.org has llvm-18-dev / libclang-18-dev / libclang-cpp18-dev
          # for jammy; the default Ubuntu repos do not.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libclang-18-dev libclang-cpp18-dev clang-tools-18 ninja-build python3-pip
          pip3 install --user --break-system-packages lit || pip3 install --user lit

      - name: Install LLVM 18 + tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 ninja
          brew link --overwrite llvm@18 || true
          pip3 install --user --break-system-packages lit || true
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"

      # Cache the extracted LLVM 18 install so the 600 MB tarball is only
      # downloaded + xz-decompressed on the very first run (or after the
      # cache key bumps). Bump the trailing -vN whenever the install
      # layout changes so stale caches are forcibly invalidated.
      # Same key as release.yml so both workflows share the cache pool.
      - name: Cache LLVM 18 (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache-windows
        uses: actions/cache@v4
        with:
          path: C:\llvm18
          key: llvm-windows-x86_64-18.1.8-v1

      - name: Install LLVM 18 + tools (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz'
          curl.exe -L --fail --retry 5 --retry-delay 10 --max-time 900 `
            -o C:\llvm18.tar.xz $url

          # Use 7z instead of bsdtar — xz decompression is dramatically
          # faster (minutes vs potentially hours with Windows bsdtar).
          mkdir C:\llvm18 -Force | Out-Null
          7z x C:\llvm18.tar.xz -oC:\ -y
          7z x C:\llvm18.tar -oC:\llvm18-tmp -y
          $inner = Get-ChildItem C:\llvm18-tmp -Directory | Select-Object -First 1
          Move-Item "$($inner.FullName)\*" C:\llvm18\ -Force
          Remove-Item C:\llvm18.tar.xz, C:\llvm18.tar, C:\llvm18-tmp -Recurse -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path 'C:\llvm18\lib\cmake\llvm\LLVMConfig.cmake')) {
            Get-ChildItem C:\llvm18 -Recurse -Name 'LLVMConfig.cmake' | Select-Object -First 5
            throw 'LLVMConfig.cmake missing after extraction'
          }

      - name: Patch LLVMExports.cmake DIA SDK path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exports = 'C:\llvm18\lib\cmake\llvm\LLVMExports.cmake'
          if (-not (Test-Path $exports)) { throw "$exports not found" }
          $bad = 'C:/Program Files (x86)/Microsoft Visual Studio/2019/Professional/DIA SDK/lib/amd64/diaguids.lib'
          $diaLib = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\2022\*\DIA SDK\lib\amd64\diaguids.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $diaLib) { throw 'diaguids.lib not found on this runner' }
          $good = $diaLib.FullName -replace '\\','/'
          $content = Get-Content $exports -Raw
          if ($content.Contains($bad)) {
            $content = $content.Replace($bad, $good)
            Set-Content -Path $exports -Value $content -Encoding UTF8 -NoNewline
            Write-Host "Patched DIA SDK path -> $good"
          } else {
            Write-Host "DIA SDK path already correct, skipping patch"
          }

      # ninja and lit are NOT cached on purpose: they are tiny and
      # choco/pip install them in seconds. Always exporting LLVM_HOME
      # keeps Locate-LLVM-cmake-config below stable across cache hit/miss.
      - name: Install ninja + lit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y
          py -m pip install --user lit
          echo "LLVM_HOME=C:\llvm18" >> $env:GITHUB_ENV

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate LLVM cmake config
        id: llvm_cmake
        shell: bash
        run: |
          # Per-OS resolution rather than searching, so the failure mode
          # is "package missing" rather than "find returned empty".
          case "${{ runner.os }}" in
            Linux)
              LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
              CLANG_DIR=/usr/lib/llvm-18/lib/cmake/clang
              ;;
            macOS)
              PREFIX=$(brew --prefix llvm@18)
              LLVM_DIR="$PREFIX/lib/cmake/llvm"
              CLANG_DIR="$PREFIX/lib/cmake/clang"
              ;;
            Windows)
              LLVM_DIR='C:/llvm18/lib/cmake/llvm'
              CLANG_DIR='C:/llvm18/lib/cmake/clang'
              ;;
          esac
          for d in "$LLVM_DIR" "$CLANG_DIR"; do
            if [[ ! -d "$d" ]]; then
              echo "::error::Expected cmake package dir does not exist: $d"
              exit 1
            fi
          done
          echo "LLVM_DIR=$LLVM_DIR"
          echo "Clang_DIR=$CLANG_DIR"
          echo "llvm_dir=$LLVM_DIR"   >> "$GITHUB_OUTPUT"
          echo "clang_dir=$CLANG_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure
        shell: bash
        working-directory: LenovoTidyChecks
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLENOVO_TIDY_BUILD_TESTS=ON \
            -DLLVM_DIR="${{ steps.llvm_cmake.outputs.llvm_dir }}" \
            -DClang_DIR="${{ steps.llvm_cmake.outputs.clang_dir }}"

      - name: Build
        working-directory: LenovoTidyChecks
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build -j2
          else
            cmake --build build -j
          fi

      - name: Test (unit only)
        working-directory: LenovoTidyChecks
        # Skip the lit-based regression suite in CI: it depends on
        # clang-tidy-18 + FileCheck binaries on PATH plus encoding-
        # sensitive Chinese-character fixtures that misbehave on hosted
        # runners. The unit tests (Googletest) cover the language-
        # agnostic helpers; the lit tests are what `Smoke-test
        # lenovo-clang-tidy --list-checks` below proxies for.
        run: ctest --test-dir build --output-on-failure --exclude-regex lit

      - name: Check rule coverage
        working-directory: LenovoTidyChecks
        run: python3 scripts/generate_rules_index.py

      # Self-test the standalone executable: it must list every lenovo-* check.
      # On Windows this is the *only* path that actually works at runtime,
      # because LLVM's official Windows binaries disable plugin loading.
      #
      # libclang-cpp-18.so / dylib lives in the LLVM install lib/ dir which
      # the linker doesn't search by default on Linux. Set the loader env
      # appropriately per OS so the binary can resolve its dependencies.
      - name: Smoke-test lenovo-clang-tidy --list-checks
        # Linux currently aborts (SIGABRT 134) at startup, very likely an
        # LLVM ManagedStatic double-init between the apt-shipped
        # libclang-cpp-18.so and statically linked LLVM components inside
        # LenovoTidyChecks itself. macOS works (brew layout differs) and
        # Windows works (binary uses its own private LLVM by design). The
        # Linux soft-fail is tracked - tightening to hard-fail blocked
        # on a follow-up that links lenovo-clang-tidy purely shared on
        # Linux too.
        continue-on-error: ${{ runner.os == 'Linux' }}
        shell: bash
        working-directory: LenovoTidyChecks
        # GH Actions defaults to `bash -eo pipefail`. Diagnostic commands
        # (ls / ldd / otool) MUST guard against failure with `|| true`,
        # otherwise a missing libdir aborts the whole script before we
        # reach the actual smoke check.
        run: |
          case "${{ runner.os }}" in
            Linux)
              EXE="build/src/LenovoTidyMain/lenovo-clang-tidy"
              export LD_LIBRARY_PATH="/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH:-}"
              echo "=== Linux runtime diagnostics ==="
              { ls -la /usr/lib/llvm-18/lib/libclang-cpp* 2>&1 | head -5; } || true
              { ldd "$EXE" 2>&1 | head -25; } || true
              ;;
            macOS)
              EXE="build/src/LenovoTidyMain/lenovo-clang-tidy"
              export DYLD_LIBRARY_PATH="$(brew --prefix llvm@18)/lib:${DYLD_LIBRARY_PATH:-}"
              ;;
            Windows)
              EXE="build/src/LenovoTidyMain/lenovo-clang-tidy.exe"
              export PATH="C:/llvm18/bin:$PATH"
              ;;
          esac
          test -x "$EXE" || { echo "::error::$EXE not built"; exit 1; }
          set +e
          OUT=$("$EXE" "--checks=-*,lenovo-*" --list-checks 2>&1)
          RC=$?
          set -e
          echo "=== exit=$RC, output: ==="
          echo "$OUT"
          if [[ $RC -ne 0 ]]; then
            echo "::error::lenovo-clang-tidy exited $RC"
            exit 1
          fi
          # We expect at least 15 lenovo-* rules (see AnalyzerRules.md / CHANGELOG).
          COUNT=$(echo "$OUT" | grep -c "^[[:space:]]\+lenovo-" || true)
          echo "lenovo-* checks found: $COUNT"
          if [[ "$COUNT" -lt 15 ]]; then
            echo "::error::Expected >=15 lenovo-* rules, got $COUNT"
            exit 1
          fi

      - name: Upload artifacts
        if: matrix.build_type == 'RelWithDebInfo'
        uses: actions/upload-artifact@v7
        with:
          name: LenovoTidyChecks-${{ matrix.os }}
          path: |
            LenovoTidyChecks/build/src/LenovoTidyModule/libLenovoTidyChecks.*
            LenovoTidyChecks/build/src/LenovoTidyModule/LenovoTidyChecks.*
            LenovoTidyChecks/build/src/LenovoTidyMain/lenovo-clang-tidy
            LenovoTidyChecks/build/src/LenovoTidyMain/lenovo-clang-tidy.exe
          if-no-files-found: warn
